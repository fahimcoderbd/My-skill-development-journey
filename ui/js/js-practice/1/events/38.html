<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!--chnage event-->
    <!--used to detect user's changes-->

    <label>Choose your passion</label>

    <select id="select_passion">
        <option value="coding">Coding</option>
        <option value="gaming">Gaming</option>
        <option value="both">Both</option>
    </select>

    <script>
   document.getElementById('select_passion').addEventListener('change', function() {
            alert("Your passion is " + this.value);
        });
    </script>
</body>
</html>
