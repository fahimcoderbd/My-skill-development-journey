<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Both mouse events</title>
    <style>
        .box {
            width:500px;
            height:500px;
            background:whitesmoke;
            text-align:center;
            border-radius:30px;
            cursor:pointer;
            line-height:150px;
            color:purple;
            align-content:center;
        }
    </style>
</head>
<body bgcolor="black">
    <div class="box" onmouseover="chnagebg(this)" onmouseout="reset(this)"
    onclick="clicked(this)">
    <h1>Box title:Mybox</h1>
    <h2>Made by Fahim</h2>
    </div>

    <script>
        function chnagebg(el){
            el.style.backgroundColor = "white";
            el.style.color = "black";
        }
        function reset(el){
            el.stye.backgroundColor = "whitesmoke";
            el.style.color = "purple";
        }
        function clicked(el){
            alert("You clicked the box")
        }
    </script>
</body>
</html>
