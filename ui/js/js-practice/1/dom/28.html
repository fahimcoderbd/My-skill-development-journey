<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Light Mode</title>
</head>
<body id="body">
  <h1>Dark mode => Light mode</h1>
  <button onclick="change_bg()">Switch</button>

<script>
  // keep a state variable
  let dark = false;

  const change_bg = () => {
    let body = document.getElementById('body');
    if (!dark) {
      body.style.backgroundColor = "black";
      body.style.color = "white"; // also change text color
    } else {
      body.style.backgroundColor = "white";
      body.style.color = "black";
    }
    dark = !dark; // toggle state
  }
</script>
</body>
</html>
