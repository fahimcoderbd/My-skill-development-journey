<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       <style>
        .dark{
            background-color:black;
            color:purple;
            font-size: 30px;
        }
     </style>
</head>
<body id="body">
    <!--classlist-->
    <button onclick="theme()">Chnage theme</button>
    <script>
       const theme = () =>{
          let body = document.getElementById('body');
          body.classList.toggle("dark")
       }
    </script>

    <!--content-->
    <h1>Welcome to my wbsite</h1>
    <h2>This is a webpage developed by me!</h2>
</body>
</html>
