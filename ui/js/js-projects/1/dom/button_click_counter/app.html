<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button click counter</title>
</head>
<body>
    <h2>Click counter App</h2>
    <h3>made by Fahim Abrar</h3>
    <!--app-->
    <p>Count: <span id="count">0</span></p>
    <button onclick="count_num()">Count</button>

    <script>
        let count = 0;
      function count_num(){
          count ++;
          document.getElementById('count').textContent = count;
      }
    </script>
</body>
</html>
