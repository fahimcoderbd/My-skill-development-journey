<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic light app</title>
</head>
<body>
    <script>
        //traffic light

        const light = prompt("Enter the traffic color: ");

        //cases
        switch(light){
            case "red":
                alert("stop baby!");
                 break;
            case "green":
                alert("Yeah u can cross!");
                break;
            case "yellow":
                alert("pls wait man!");
        }
    </script>
</body>
</html>
