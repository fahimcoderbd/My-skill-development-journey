<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fahim Notes</title>
  <!--styling-->
  <link rel="stylesheet" href="app.css">
  <!--javascript-->
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Fahim Notes 📝</h1>
  <div class="container">
    <textarea placeholder="Write your note here..." id="notetxt"></textarea>
    <button id="add_btn">Add Note</button>

    <div class="notes-section">
      <h2>My Notes:</h2>
      <div id="notes-list">
        <!-- Notes will be dynamically added here -->
      </div>
    </div>
  </div>
</body>
</html>
