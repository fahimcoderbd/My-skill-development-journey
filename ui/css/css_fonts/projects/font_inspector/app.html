<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personal card</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="card">
      <h1>Hello world</h1>
       
      <span> Font size <input type="range" value="20"> 20px</span> <br>
      <span> letter-spacing <input type="range" value="0"> 0</span> <br>
      <span> line-height <input type="range" value="1.5"> 1.5</span>
    </div>

    <script>
    const preview = document.querySelector('h1');
    const sliders = document.querySelectorAll('input[type="range"]');

    // font-size slider
    sliders[0].min = 10;
    sliders[0].max = 80;
    sliders[0].value = 20;
    sliders[0].addEventListener('input', function() {
        preview.style.fontSize = this.value + 'px';
        this.nextSibling.textContent = ' ' + this.value + 'px';
    });

    // letter-spacing slider
    sliders[1].min = 0;
    sliders[1].max = 20;
    sliders[1].value = 0;
    sliders[1].addEventListener('input', function() {
        preview.style.letterSpacing = this.value + 'px';
        this.nextSibling.textContent = ' ' + this.value + 'px';
    });

    // line-height slider
    sliders[2].min = 10;
    sliders[2].max = 30;
    sliders[2].value = 15;
    sliders[2].addEventListener('input', function() {
        preview.style.lineHeight = this.value / 10;
        this.nextSibling.textContent = ' ' + (this.value / 10).toFixed(1);
    });
</script>
</body>
</html>
