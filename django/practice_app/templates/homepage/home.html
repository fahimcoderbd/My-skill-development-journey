{% extends 'homepage/base.html' %}

{% block title %}Homepage{% endblock %}

{% block main %}

<div class="mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center space-y-6 mt-10">
    
    <h1 class="text-3xl font-extrabold text-gray-800 tracking-tight">
        Welcome to Practice Application!
    </h1>
    
    <p class="text-gray-500 text-sm">
        Select a module below to start exploring your practice application.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 justify-center px-3 py-3">
        <button 
            onclick="location.href='/article/'" 
            class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition-all duration-200 ease-in-out transform hover:-translate-y-0.5">
            Article App
        </button>

        <button 
            onclick="location.href='/notes/'" 
            class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition-all duration-200 ease-in-out transform hover:-translate-y-0.5">
            Notes App
        </button>

        <button 
            onclick="location.href='/books/'" 
            class="w-full sm:w-auto px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition-all duration-200 ease-in-out transform hover:-translate-y-0.5">
            Books App
        </button>
        
        <button 
            onclick="location.href='/admin/'" 
            class="w-full sm:w-auto px-6 py-3 bg-gray-800 hover:bg-gray-950 text-white font-medium rounded-xl shadow-sm transition-all duration-200 ease-in-out transform hover:-translate-y-0.5">
            Admin Panel
        </button>
    </div>
    
</div>
    
{% endblock %}
