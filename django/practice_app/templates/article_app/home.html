{% extends 'article_app/base.html' %}

{% block title %}Article - Home{% endblock %}

{% block main %}
<div class="text-center max-w-2xl mx-auto mb-12">
    <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">📚 Welcome to Article App</h1>
    <p class="text-lg text-gray-500">Manage, write, and publish your content seamlessly.</p>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 max-w-5xl mx-auto">
    
    <a href="create/" class="group flex flex-col items-center p-6 bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-indigo-100 transition-all duration-300">
        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-plus"></i>
        </div>
        <h3 class="font-bold text-gray-900 text-lg">Create Article</h3>
        <p class="text-sm text-gray-500 text-center mt-2">Draft and publish new content.</p>
    </a>

    <a href="show_articles/" class="group flex flex-col items-center p-6 bg-white rounded-2xl shadow-sm border border-gray-100 hover:shadow-lg hover:border-blue-100 transition-all duration-300">
        <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition-transform">
            <i class="fa-solid fa-newspaper"></i>
        </div>
        <h3 class="font-bold text-gray-900 text-lg">Show Articles</h3>
        <p class="text-sm text-gray-500 text-center mt-2">View your published library.</p>
    </a>

</div>
{% endblock %}
