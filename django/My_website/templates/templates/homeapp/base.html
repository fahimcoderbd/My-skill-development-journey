{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Fahim Abrar | Software Developer{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'homeapp/css/styles.css' %}">
</head>
<body class="page-body">
  <div class="page-shell">
    <!-- Page header and navigation -->
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand">Fahim Abrar</a>
        <button id="menuButton" class="menu-toggle" aria-expanded="false" aria-controls="navMenu">
          <span class="sr-only">Toggle navigation</span>
          <svg class="icon-menu" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <nav id="navMenu" class="site-nav hidden">
          <a href="/" class="nav-link">Home</a>
          <a href="/about/" class="nav-link">About</a>
          <a href="/contact/" class="nav-link">Contact</a>
          <a href="#features" class="nav-link nav-link-hidden">Features</a>
        </nav>
      </div>
    </header>

    <!-- Main content area -->
    <main class="site-main">
      <div class="content-wrapper">
        {% block content %}{% endblock %}
      </div>
    </main>

    <!-- Site footer -->
    <footer class="site-footer">
      <div class="footer-inner">Designed with glasmorphism and responsive CSS.</div>
    </footer>
  </div>
  <script src="{% static 'homeapp/js/main.js' %}"></script>
</body>
</html>
