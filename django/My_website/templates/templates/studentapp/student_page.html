{% extends 'templates/studentapp/base.html' %}
{% load static %}

{% block title %}Student Profile - Student Management{% endblock %}

{% block main %}
<style>
    .student-page {
        max-width: 960px;
        margin: 0 auto;
        padding: 1.5rem 1rem;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .page-header {
        margin-bottom: 1.75rem;
    }

    .page-title {
        font-size: 2rem;
        margin: 0 0 0.35rem;
        color: #111827;
    }

    .page-subtitle {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
    }

    .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    }

    .card {
        display: block;
        border-radius: 1rem;
        border: 1px solid #e5e7eb;
        background:black;
        padding: 1.5rem;
        text-decoration: none;
        color: inherit;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        width:60%;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 55px rgba(15, 23, 42, 0.14);
        background-color:green;
    }

    .card-action {
        min-height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .text-large {
        font-size: 1.5rem;
        color:white;
    }

    .font-bold {
        font-weight: 700;
    }

    .text-center {
        text-align: center;
    }
</style>

<div class="student-page">
    <div class="page-header">
        <h1 class="page-title">Student Management App</h1>
        <p class="page-subtitle">Created by Fahim Abrar</p>
    </div>

    <div class="grid">
         <a href="/student/add_student" class="card card-action text-center">
            <span class="text-large font-bold">Add student</span>

        <a href="/student/show_students" class="card card-action text-center">
            <span class="text-large font-bold">Show students</span>
        </a>
    </div>
</div>
{% endblock %}
